<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Evaluaciones{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'listar' %}">Inicio</a>
        {% if user.is_authenticated %}
            | <a href="{% url 'crear' %}">Nueva calificación</a>
            | <a href="{% url 'promedio_general' %}">Promedio general</a>
            | <a href="{% url 'logout' %}">Cerrar sesión</a>
            | <strong>{{ user.username }}</strong>
        {% else %}
            | <a href="{% url 'login' %}">Iniciar sesión</a>
            | <a href="{% url 'registro' %}">Registrarse</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
