{% extends 'calificaciones/base.html' %}

{% block title %}Registrarse{% endblock %}

{% block content %}
    <h1>Registro de usuario</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Crear cuenta</button>
    </form>
    <p>Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>.</p>
{% endblock %}
