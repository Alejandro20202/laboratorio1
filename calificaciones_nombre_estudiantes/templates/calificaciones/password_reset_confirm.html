{% extends 'calificaciones/base.html' %}

{% block title %}Nueva contraseña{% endblock %}

{% block content %}
    <h1>Nueva contraseña</h1>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar contraseña</button>
        </form>
    {% else %}
        <p>El enlace no es válido o ya fue usado.</p>
        <p><a href="{% url 'password_reset' %}">Solicitar otro enlace</a></p>
    {% endif %}
{% endblock %}
