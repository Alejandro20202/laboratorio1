<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Calificación</title>
</head>
<body>
    <h1>Eliminar Calificación</h1>
    <p>¿Deseas eliminar la calificación de <strong>{{ calificacion.nombre_estudiante }}</strong> para la asignatura <strong>{{ calificacion.asignatura }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar eliminación</button>
        <a href="{% url 'listar' %}">Cancelar</a>
    </form>
</body>
</html>
